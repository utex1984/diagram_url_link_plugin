<!doctype html>
<html>
<head>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      font-family: Inter, "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 11px;
      color: var(--figma-color-text, #333);
      background: var(--figma-color-bg, #fff);
    }
    * { box-sizing: border-box; }

    .content {
      padding: 12px 12px 8px;
    }

    .field {
      margin-bottom: 8px;
    }

    .field label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 4px;
      color: var(--figma-color-text, #333);
    }

    .field input[type="text"] {
      width: 100%;
      padding: 6px 8px;
      font-size: 11px;
      font-family: inherit;
      border: 1px solid var(--figma-color-border, #d4d4d4);
      border-radius: 6px;
      background: var(--figma-color-bg, #fff);
      color: var(--figma-color-text, #333);
      outline: none;
    }

    .field input[type="text"]:focus {
      border-color: var(--figma-color-bg-brand, #0d99ff);
      box-shadow: 0 0 0 1px var(--figma-color-bg-brand, #0d99ff);
    }

    .footer {
  flex-wrap: wrap;          /* hyphen + semicolon */
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  border-top: 1px solid var(--figma-color-border, #e5e5e5);
}

.footer .status {
  width: 100%;              /* semicolon */
  font-size: 11px;
  color: var(--figma-color-text-secondary, #333);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  display: block;
  margin-bottom: 12px;
}


    .footer button {
      padding: 6px 12px;
      font-size: 11px;
      font-family: inherit;
      font-weight: 500;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
    }

    .footer button.primary {
      background: var(--figma-color-bg-brand, #0d99ff);
      color: #fff;
    }

    .footer button.primary:hover {
      opacity: 0.9;
    }

    .footer button.secondary {
      background: var(--figma-color-bg-secondary, #f0f0f0);
      color: var(--figma-color-text, #333);
    }

    .footer button.secondary:hover {
      opacity: 0.85;
    }

    .footer button:disabled {
      opacity: 0.4;
      cursor: default;
    }
  </style>
</head>
<body>
  <div class="content">
    <div class="field">
      <p>Select a Figma layer and enter a URL link:</p>
      <label>URL link</label>
      <input type="text" id="urlLink" value="/product/" />
    </div>
  </div>
  <div class="footer">
    <span class="status" id="status-apply"></span>
    <button class="secondary" id="action-remove" disabled>Remove link</button>
    <button class="secondary" id="action-read" disabled>Read data</button>
    <button class="primary" id="action-apply" disabled>Apply data</button>
  </div>

  <script>
    function currentParams() {
      return {
        urlLink: String(document.getElementById('urlLink').value),
      }
    }

    function setControlValue(id, value) {
      const input = document.getElementById(id)
      if (!input) return
      input.value = String(value)
    }

    function setPanelParams(values) {
      if (typeof values !== 'object' || values === null) return
      if (Object.prototype.hasOwnProperty.call(values, 'urlLink')) {
        setControlValue('urlLink', values.urlLink)
      }
    }

    document.getElementById('action-apply').addEventListener('click', () => {
      parent.postMessage({ pluginMessage: { type: 'action', id: 'apply', params: currentParams() } }, '*')
    })

    document.getElementById('action-read').addEventListener('click', () => {
      parent.postMessage({ pluginMessage: { type: 'action', id: 'read', params: currentParams() } }, '*')
    })

    document.getElementById('action-remove').addEventListener('click', () => {
      parent.postMessage({ pluginMessage: { type: 'action', id: 'remove', params: currentParams() } }, '*')
    })

    window.onmessage = (event) => {
      const msg = event.data && event.data.pluginMessage
      if (!msg) return

      if (msg.type === 'params-change') {
        setPanelParams(msg.params)
        return
      }

      if (msg.type === 'action-state' && msg.actions) {
        const applyAction = msg.actions['apply']
        const applyBtn = document.getElementById('action-apply')
        if (applyAction && applyBtn) {
          if (applyAction.enabled === false) applyBtn.setAttribute('disabled', '')
          else applyBtn.removeAttribute('disabled')
          if (typeof applyAction.label === 'string') applyBtn.textContent = applyAction.label
        }
        const applyStatus = document.getElementById('status-apply')
        if (applyAction && applyStatus && typeof applyAction.status === 'string') {
          applyStatus.textContent = applyAction.status
        }

        const removeAction = msg.actions['remove']
        const removeBtn = document.getElementById('action-remove')
        if (removeAction && removeBtn) {
          if (removeAction.enabled === false) removeBtn.setAttribute('disabled', '')
          else removeBtn.removeAttribute('disabled')
          if (typeof removeAction.label === 'string') removeBtn.textContent = removeAction.label
        }

        const readAction = msg.actions['read']
        const readBtn = document.getElementById('action-read')
        if (readAction && readBtn) {
          if (readAction.enabled === false) readBtn.setAttribute('disabled', '')
          else readBtn.removeAttribute('disabled')
          if (typeof readAction.label === 'string') readBtn.textContent = readAction.label
        }
      }
    }

    // Report height for iframe resize
    let lastH = 0
    function reportHeight() {
      const h = Math.ceil(document.body.getBoundingClientRect().height)
      if (h && h !== lastH) {
        lastH = h
        parent.postMessage({ pluginMessage: { type: 'resize', height: h } }, '*')
      }
    }
    if (typeof ResizeObserver !== 'undefined') {
      new ResizeObserver(reportHeight).observe(document.body)
    }
  </script>
</body>
</html>
